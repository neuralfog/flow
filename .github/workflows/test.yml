name: test

on:
  push:
  pull_request:
  # Callable as the first gate of the release pipeline (release.yml).
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The test suite runs under Bun (`bun test`) and spins up Postgres via the
      # package's docker-compose — Docker is preinstalled on ubuntu runners.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: pnpm install --frozen-lockfile

      - name: Lint changelog
        run: node scripts/changelog.mjs lint

      - run: pnpm build

      - run: pnpm lint

      - run: pnpm test
