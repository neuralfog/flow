name: release

# Fires on a `v*` tag (created by `pnpm tag`) or manual dispatch. Nothing
# publishes unless test → changelog are green.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.0)'
        required: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.v.outputs.value }}
    steps:
      - id: v
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

  # ── gate 1: the full test suite (reused from test.yml) ──────────────────────
  test:
    uses: ./.github/workflows/test.yml

  # ── gate 2: the changelog's top entry == <version>, well-formed ─────────────
  changelog:
    needs: [test, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check changelog
        run: node scripts/changelog.mjs check "${{ needs.version.outputs.value }}"

  # ── publish @neuralfog/flow to npm ──────────────────────────────────────────
  publish-flow:
    name: publish @neuralfog/flow
    needs: [changelog, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Stamp version
        env:
          VERSION: ${{ needs.version.outputs.value }}
        run: |
          node -e '
            const fs = require("node:fs");
            const f = "packages/flow/package.json";
            const p = JSON.parse(fs.readFileSync(f, "utf8"));
            p.version = process.env.VERSION;
            fs.writeFileSync(f, `${JSON.stringify(p, null, 4)}\n`);
            console.log(`@neuralfog/flow@${process.env.VERSION}`);
          '

      - name: Build
        run: pnpm --filter @neuralfog/flow build

      - name: Stage changelog
        run: cp CHANGELOG.md packages/flow/CHANGELOG.md

      - name: Publish
        working-directory: packages/flow
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${{ needs.version.outputs.value }}"
          TAG="latest"
          [[ "$VERSION" == *-* ]] && TAG="next"
          echo "publishing @neuralfog/flow@$VERSION under dist-tag: $TAG"
          pnpm publish --access public --provenance --no-git-checks --tag "$TAG"

  # ── cut the GitHub Release ───────────────────────────────────────────────────
  release-notes:
    needs: [publish-flow, version]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assemble release notes
        run: node scripts/release-notes.mjs "${{ needs.version.outputs.value }}" > RELEASE_NOTES.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.version.outputs.value }}"
          TAG="${{ github.ref_name }}"
          [ -z "$TAG" ] && TAG="v$VERSION"
          PRERELEASE=()
          [[ "$VERSION" == *-* ]] && PRERELEASE=(--prerelease)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" --title "$VERSION" --notes-file RELEASE_NOTES.md "${PRERELEASE[@]}"
          fi
