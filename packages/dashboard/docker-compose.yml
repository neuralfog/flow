services:
  postgres:
    image: postgres:17-alpine
    container_name: flow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-flow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-flow}
      POSTGRES_DB: ${DB_NAME:-flow}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-flow} -d ${DB_NAME:-flow}"]
      interval: 5s
      timeout: 5s
      retries: 5
